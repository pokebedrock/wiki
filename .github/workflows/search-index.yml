name: wiki-search

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/content/**"
      - "schemas/**"
      - "scripts/**"
      - ".github/workflows/search-index.yml"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    env:
      WIKI_SEARCH_SYNC_URL: ${{ secrets.WIKI_SEARCH_SYNC_URL }}
      WIKI_SEARCH_SYNC_TOKEN: ${{ secrets.WIKI_SEARCH_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build search index
        run: npm run build:search
      - name: Sync search index via website backend
        if: ${{ env.WIKI_SEARCH_SYNC_URL != '' && env.WIKI_SEARCH_SYNC_TOKEN != '' }}
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $WIKI_SEARCH_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @build/search-indices.json \
            "$WIKI_SEARCH_SYNC_URL"
      - name: Note skipped sync when backend credentials are unset
        if: ${{ env.WIKI_SEARCH_SYNC_URL == '' || env.WIKI_SEARCH_SYNC_TOKEN == '' }}
        run: |
          echo 'WIKI_SEARCH_SYNC_URL or WIKI_SEARCH_SYNC_TOKEN is unset; skipped backend sync after building search artifacts.'
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: |
            build/search-index.json
            build/search-indices.json
            build/content/en/pokemon-manifest.json
            build/content/en/moves-manifest.json
            build/content/en/move-learners-manifest.json
            build/content/es/pokemon-manifest.json
            build/content/es/moves-manifest.json
            build/content/es/move-learners-manifest.json

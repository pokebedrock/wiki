name: wiki-search

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/content/**"
      - "schemas/**"
      - "scripts/build-search-index.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          cache-dependency-path: package-lock.json
      - run: npm install
      - name: Build search index
        run: npm run build:search
        env:
          MEILISEARCH_INDEX: wiki-docs
      - name: Sync search index via website backend
        env:
          WIKI_SEARCH_SYNC_URL: ${{ secrets.WIKI_SEARCH_SYNC_URL }}
          WIKI_SEARCH_SYNC_TOKEN: ${{ secrets.WIKI_SEARCH_SYNC_TOKEN }}
        run: |
          test -n "$WIKI_SEARCH_SYNC_URL"
          test -n "$WIKI_SEARCH_SYNC_TOKEN"
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $WIKI_SEARCH_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @build/search-index.json \
            "$WIKI_SEARCH_SYNC_URL"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-index
          path: build/search-index.json


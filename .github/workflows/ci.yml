name: wiki-ci

on:
  pull_request:
    paths:
      - "wiki/**"
  push:
    paths:
      - "wiki/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run lint:links


